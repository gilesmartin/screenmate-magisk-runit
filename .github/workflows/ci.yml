name: Packaging checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - run: git diff --check
      - name: ShellCheck
        run: |
          shellcheck --shell=sh scripts/install.sh scripts/uninstall.sh scripts/doctor.sh reference/*.in reference/magisk/bin/*.in reference/services/magisk/*.in
